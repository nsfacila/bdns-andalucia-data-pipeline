name: Grant Hunter AI - Captador de Subvenciones BDNS

on:
  # Programación automática: Todos los días a las 05:00 UTC (07:00 AM en España)
  schedule:
    - cron: '0 5 * * 1'
  
  # Permite lanzar el pipeline manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-captador:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 2. Configurar entorno de Python 3.11
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias del proyecto
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Validar filtros y conectores sin depender de la disponibilidad de la BDNS
      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s test -v

      # 5. Ejecutar el pipeline principal con las variables de entorno secretas
      - name: Ejecutar Pipeline de Subvenciones
        id: pipeline
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          DRY_RUN: 'False'
        run: |
          python captador_bbdd/main.py

      # 6. Persistir el histórico acumulado en el repositorio
      - name: Actualizar histórico en el repositorio
        if: always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registro_historico.csv
          if git diff --cached --quiet; then
            echo "El histórico no ha cambiado."
          else
            git commit -m "Actualizar histórico de subvenciones"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # 7. Guardar el archivo CSV histórico como artefacto descargable tras la ejecución
      - name: Guardar Histórico CSV como Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-historico-subvenciones
          path: data/registro_historico.csv
          retention-days: 30